<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DetailingNI | Professional Automotive Detailing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #161b22;
            --accent-cyan: #00f0ff;
            --accent-gold: #d4af37;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .glass-nav {
            position: fixed; top: 0; width: 100%; display: flex;
            justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background: rgba(15, 17, 21, 0.85);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        .logo { font-weight: 700; font-size: 1.25rem; color: var(--accent-cyan); letter-spacing: 1px; }
        nav a { color: var(--text-secondary); text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; transition: color 0.3s ease; }
        nav a:hover { color: var(--accent-cyan); }
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 1rem; background: linear-gradient(135deg, rgba(0,240,255,0.05), rgba(212,175,55,0.05));
        }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; margin-bottom: 1rem; color: var(--text-primary); }
        .hero p { color: var(--text-secondary); max-width: 600px; margin-bottom: 2rem; }
        .cta-button {
            background: transparent; color: var(--accent-cyan); border: 2px solid var(--accent-cyan);
            padding: 0.75rem 2rem; font-weight: 600; border-radius: 4px; text-decoration: none; transition: all 0.3s ease;
        }
        .cta-button:hover { background: var(--accent-cyan); color: var(--bg-dark); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        .showcase { padding: 5rem 1rem; max-width: 1000px; margin: 0 auto; text-align: center; }
        .showcase h2 { font-size: 2rem; margin-bottom: 3rem; color: var(--accent-gold); }
        .comparison-slider { position: relative; width: 100%; height: 400px; overflow: hidden; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
        .image-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }
        .label { position: absolute; bottom: 1rem; padding: 0.25rem 0.75rem; background: rgba(0, 0, 0, 0.7); border-radius: 4px; font-size: 0.85rem; color: #fff; }
        .before .label { left: 1rem; }
        .after .label { right: 1rem; }
        .mobile-action-bar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 0.75rem; z-index: 1000; }
        @media (max-width: 768px) {
            .mobile-action-bar { display: flex; justify-content: space-around; }
            nav { display: none; }
        }
        .action-btn { flex: 1; text-align: center; padding: 0.75rem; margin: 0 0.25rem; background: rgba(255, 255, 255, 0.05); color: var(--text-primary); text-decoration: none; border-radius: 4px; font-weight: 600; }
        .action-btn.primary { background: var(--accent-cyan); color: var(--bg-dark); }
        .visible { opacity: 1 !important; transform: translateY(0) !important; }
    </style>
</head>
<body>
    <header class="glass-nav">
        <div class="logo">DetailingNI</div>
        <nav>
            <a href="#services">Services</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Precision Automotive Detailing & Protection</h1>
            <p>Professional ceramic coatings, paint correction, and custom studio finishes.</p>
            <a href="#contact" class="cta-button">Book Consultation</a>
        </section>

        <section id="gallery" class="showcase">
            <h2>Transformation Showcase</h2>
            <div class="comparison-slider">
                <div class="image-container before">
                    <img src="before.jpg" alt="Before paint correction">
                    <span class="label">Before</span>
                </div>
                <div class="image-container after">
                    <img src="after.jpg" alt="After ceramic coating">
                    <span class="label">After</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="mobile-action-bar">
        <a href="tel:+447000000000" class="action-btn">Call Studio</a>
        <a href="#contact" class="action-btn primary">Book Now</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observerOptions = { threshold: 0.1 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.showcase, .hero').forEach(section => {
                section.style.opacity = '0';
                section.style.transform = 'translateY(20px)';
                section.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                observer.observe(section);
            });
        });
    </script>
</body>
</html>
